<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f1115">
<title>GrokBot Task Dashboard</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#262b36;--fg:#e8eaf0;--mut:#8b93a7;--run:#3b82f6;--ok:#22c55e;--wait:#a78bfa;--queue:#64748b;--block:#ef4444;--quota:#f59e0b;--routine:#14b8a6}
@media (prefers-color-scheme: light){:root{--bg:#f4f6f8;--card:#fff;--line:#e3e6ec;--fg:#151821;--mut:#646c80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;padding:20px max(20px,env(safe-area-inset-right)) 48px max(20px,env(safe-area-inset-left))}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:0 0 14px}
.brand{display:flex;flex-direction:column;gap:0}
h1{font-size:22px;margin:0;letter-spacing:-.02em}
h3{font-size:16px;margin:0 0 8px}
h4{font-size:14px;margin:0 0 8px}
.sub{color:var(--mut);font-size:13px}
.brand .sub{margin:0}
#gen{margin-right:auto}
button.lang{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:4px 12px;cursor:pointer;font:inherit}
button.lang:focus-visible{outline:2px solid var(--run);outline-offset:2px}
.banner{background:var(--quota);color:#1c1403;padding:8px 12px;border-radius:10px;margin:0 0 12px;font-size:13.5px;font-weight:600}
.sum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 11px;font-size:13px}
.chip b{font-weight:600}
.chip{cursor:pointer;user-select:none}.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)!important}.badge[data-f]{cursor:pointer}
.qrow{display:flex;justify-content:space-between;font-size:13px;margin-top:10px}
.kv .stale{color:var(--quota)}
.grid,.claude,.acc-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px}
.card.alert{border-color:var(--quota);box-shadow:0 0 0 1px var(--quota) inset}
.card.bad{border-color:var(--block);box-shadow:0 0 0 1px var(--block) inset}
.card.idle{opacity:.72}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ch h2{font-size:17px;margin:0}
.desc{color:var(--mut);font-size:12px;margin:2px 0 8px}
.task{border-top:1px solid var(--line);padding:9px 0}
.task:first-of-type{border-top:0}
.tt{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.title{font-weight:600}
.badge{flex:none;font-size:12px;border-radius:6px;padding:1px 7px;color:#fff;white-space:nowrap}
.s-running{background:var(--run)}.s-done{background:var(--ok)}.s-waiting{background:var(--wait)}.s-queued{background:var(--queue)}.s-blocked{background:var(--block)}.s-quota{background:var(--quota);color:#111}.s-routine{background:var(--routine)}.s-cancelled{background:var(--queue)}
.bar{height:7px;background:var(--line);border-radius:9px;overflow:hidden;margin:7px 0 4px}
.bar i{display:block;height:100%;border-radius:9px}
.meta{display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--mut);font-size:12.5px}
.meta .late{color:var(--block);font-weight:600}
.meta .stale{color:var(--quota)}
.stage{font-size:13.5px;margin-top:2px}
.cal{font-size:12.5px;color:var(--fg);margin-top:4px}
.note{font-size:12.5px;color:var(--mut);margin-top:3px;white-space:pre-wrap}
.via{font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:6px;color:var(--mut);font-weight:400}
.empty{color:var(--mut);font-size:13.5px;padding:4px 0 6px}
section{margin-top:22px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px;margin-top:8px}
.kv span:nth-child(odd){color:var(--mut)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13.5px}
.card table{border:0;background:transparent}
.tbl-wrap{overflow-x:auto;max-width:100%}
.tbl-wrap th,.tbl-wrap td{white-space:nowrap}
td,th{padding:8px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:500;border-top:0}
.ratio-hot{color:var(--block);font-weight:600}
.ratio-good{color:var(--ok);font-weight:600}
.window{margin:0 0 10px}
.err{background:#7f1d1d;color:#fff;padding:8px 12px;border-radius:10px;margin-bottom:12px;display:none}
#foot{margin-top:22px}
@media (max-width:720px){
  .grid,.claude,.acc-grid{grid-template-columns:1fr}
  td:nth-child(n+6),th:nth-child(n+6){display:none}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1 id="title">GrokBot Task Dashboard</h1>
    <p class="sub" id="subtitle">任务监控看板</p>
  </div>
  <span class="sub" id="gen">加载中…</span>
  <button class="lang" id="lang" type="button">EN</button>
</header>
<div class="banner" id="banner" hidden></div>
<div class="err" id="err"></div>
<div class="sum" id="sum"></div>
<div class="grid" id="bots"></div>
<section id="accuracy">
  <h3 id="accuracy-title">预估准确度</h3>
  <p class="sub" id="accuracy-note"></p>
  <div id="accuracy-body"></div>
</section>
<section>
  <h3 id="claude-title">Claude Code</h3>
  <div class="claude" id="claude"></div>
</section>
<section>
  <h3 id="hist-title">最近完成</h3>
  <div id="hist"></div>
</section>
<p class="sub" id="foot"></p>
<noscript>This dashboard needs JavaScript. 这个看板需要 JavaScript。</noscript>
<script type="module" src="js/dashboard.js"></script>
</body>
</html>
